                        【N:{{n}}】

                        <v-btn color="primary" @click="reverse">reverse</v-btn>

                                            app.sortBy= ['總價差']">Filter1</v-btn>

                                                        app.jsonData=app.jsonData.filter(x=> x['Flag_macd']);
                                                        app.jsonData=app.jsonData.filter(x=> parseFloat(x['Volume_MA_short']) > parseFloat(x['Volume_MA_long50']) );

                                                        app.sortBy = ['Type1','MA_last_cross_date','MA_last_cross_%'];
                                                        app.sortDesc = [true,true,true]">均價long</v-btn>
                        <v-btn color="primary" @click="

                    </v-col>
                </v-row>
                <v-row no-gutters v-show="collapse">
                    <v-col col="1" v-for="(le, index) in [...new Set(jsonData.map(x=>x.Typelevel))].sort()">
                        <v-btn color="primary" @click="jsonDataChange(le)">{{le}}</v-btn>
                    </v-col>
                </v-row>

                <v-data-table disable-pagination fixed-header height="90vh" hide-default-footer :headers="headers"

    <script>
        Vue.component('mini-candle', {
            props: {
                row: { type: Object, required: true },
                date: { type: String, required: true },
                width: { type: Number, default: 26 },
                height: { type: Number, default: 42 },
                body: { type: Number, default: 8 },
                showTrend: { type: Boolean, default: true },  // 顯示趨勢箭頭（與前一日比）
                showPivot: { type: Boolean, default: true }   // 顯示臨近轉折（局部高/低）
            },
            computed: {
                // 抓到當日 OHLC
                rec() {
                    const list = Array.isArray(this.row?.datalist) ? this.row.datalist : [];
                    const r = list.find(x => String(x.日期) === String(this.date));
                    if (!r) return null;
                    const o = parseFloat(r['開盤價']), h = parseFloat(r['最高價']),
                        l = parseFloat(r['最低價']), c = parseFloat(r['收盤價']);
                    if ([o, h, l, c].some(v => Number.isNaN(v))) return null;
                    return { o, h, l, c };
                },
                // 排序後的 datalist，方便找臨近日期
                sortedList() {
                    const list = Array.isArray(this.row?.datalist) ? this.row.datalist.slice() : [];
                    // 假設日期是 YYYY-MM-DD；若不是，改成 new Date 比對即可
                    return list.sort((a, b) => String(a.日期) < String(b.日期) ? -1 : 1);
                },
                // 找到 index 與前後一日的收盤
                neighbors() {
                    if (!this.rec) return { prev: null, next: null, idx: -1 };
                    const idx = this.sortedList.findIndex(x => String(x.日期) === String(this.date));
                    if (idx < 0) return { prev: null, next: null, idx: -1 };
                    const getClose = r => {
                        const v = parseFloat(r?.['收盤價']);
                        return Number.isFinite(v) ? v : null;
                    };
                    const prev = idx > 0 ? getClose(this.sortedList[idx - 1]) : null;
                    const next = idx < this.sortedList.length - 1 ? getClose(this.sortedList[idx + 1]) : null;
                    return { prev, next, idx };
                },
                // 與前一日比較的趨勢（↑/↓/→）
                trend() {
                    if (!this.rec) return 'none';
                    const { prev } = this.neighbors;
                    if (prev == null) return 'none';
                    if (this.rec.c > prev) return 'up';
                    if (this.rec.c < prev) return 'down';
                    return 'flat';
                },
                // 局部高/低（需同時存在前後日）
                pivot() {
                    if (!this.rec) return 'none';
                    const { prev, next } = this.neighbors;
                    if (prev == null || next == null) return 'none';
                    if (this.rec.c >= prev && this.rec.c >= next) return 'peak';   // 局部高
                    if (this.rec.c <= prev && this.rec.c <= next) return 'trough'; // 局部低
                    return 'none';
                },
                // 繪圖幾何
                geom() {
                    if (!this.rec) return null;
                    const pad = 2, H = this.height, min = this.rec.l, max = this.rec.h;
                    const y = (v) => pad + (1 - (v - min) / Math.max(1e-9, (max - min))) * (H - 2 * pad);
                    const cx = Math.floor(this.width / 2);
                    const yH = y(this.rec.h), yL = y(this.rec.l), yO = y(this.rec.o), yC = y(this.rec.c);
                    const yTop = Math.min(yO, yC);
                    const hBody = Math.max(2, Math.abs(yO - yC));
                    const up = this.rec.c >= this.rec.o; // 紅漲綠跌交給 CSS
                    return { cx, yH, yL, yTop, hBody, up };
                }
            },
            template: `
                        <div class="mini-candle-box">
                            <svg v-if="geom" :width="width+20" :height="height">
                            <!-- 上方：若是局部高，畫一個小三角 ▲；局部低則在下方 ▼ -->
                            <template v-if="showPivot && pivot==='peak'">
                                <text :x="geom.cx" y="8" font-size="9" text-anchor="middle" fill="#1976d2">▲</text>
                            </template>
                            <template v-if="showPivot && pivot==='trough'">
                                <text :x="geom.cx" :y="height-2" font-size="9" text-anchor="middle" fill="#fb8c00">▼</text>
                            </template>

                            <!-- 影線 -->
                            <line :x1="geom.cx" :x2="geom.cx" :y1="geom.yH" :y2="geom.yL"
                                    class="candle-wick" :class="geom.up ? 'candle-wick-up':'candle-wick-down'"/>
                            <!-- 本體 -->
                            <rect :x="geom.cx - body/2" :y="geom.yTop" :width="body" :height="geom.hBody"
                                    class="candle-body" :class="geom.up ? 'candle-up':'candle-down'"/>

                            <!-- 右側趨勢箭頭（與前一日收盤比較） -->
                            <template v-if="showTrend && trend!=='none'">
                                <text :x="geom.cx + body/2 + 10" :y="geom.yTop + 10"
                                    font-size="10" text-anchor="middle"
                                    :fill="trend==='up' ? '#c62828' : (trend==='down' ? '#2e7d32' : '#666')">
                                {{ trend==='up' ? '↑' : (trend==='down' ? '↓' : '→') }}
                                </text>
                            </template>
                            </svg>

                            <div v-else style="width:100%;height:100%;background:#eee;border-radius:3px;"></div>
                        </div>`
        });
    </script>
    <script>
        Vue.component('mini-candle-strip', {
            props: {
                row: { type: Object, required: true },  // 整列，含 datalist
                date: { type: String, required: true },  // 目標日期（YYYY-MM-DD）
                lookback: { type: Number, default: 4 },      // 往前 N 天 + 當天 => N+1 根
                width: { type: Number, default: 120 },
                height: { type: Number, default: 60 },
                body: { type: Number, default: 8 },      // 蠟燭本體寬
                gap: { type: Number, default: 6 },      // 蠟燭間距（可設小一點，重點在 Y 軸線）
                showLine: { type: Boolean, default: true }   // 顯示收盤價折線
            },
            computed: {
                // 排序後的整列資料
                list() {
                    const a = Array.isArray(this.row?.datalist) ? this.row.datalist.slice() : [];
                    return a.sort((x, y) => String(x.日期) < String(y.日期) ? -1 : 1);
                },
                // 取出 [date - lookback, date] 的視窗
                windowData() {
                    if (!this.list.length) return [];
                    const idx = this.list.findIndex(x => String(x.日期) === String(this.date));
                    if (idx < 0) return [];
                    const start = Math.max(0, idx - this.lookback);
                    return this.list.slice(start, idx + 1).map(r => {
                        const o = parseFloat(r['開盤價']), h = parseFloat(r['最高價']),
                            l = parseFloat(r['最低價']), c = parseFloat(r['收盤價']);
                        return { d: String(r.日期), o, h, l, c };
                    }).filter(r => [r.o, r.h, r.l, r.c].every(Number.isFinite));
                },
                // 畫布幾何 & 縮放
                geom() {
                    const pad = 2, H = this.height;
                    const highs = this.windowData.map(r => r.h);
                    const lows = this.windowData.map(r => r.l);
                    if (!highs.length) return null;
                    let max = Math.max(...highs), min = Math.min(...lows);
                    if (max <= min) { max = min + 1; }
                    const y = v => pad + (1 - (v - min) / (max - min)) * (H - 2 * pad);

                    const stride = this.body + this.gap;
                    const Wneed = this.windowData.length ? (this.windowData.length * stride - this.gap) : 0;
                    const left = Math.max(0, (this.width - Wneed) / 2);  // 置中
                    return { y, stride, left };
                },
                // 收盤價折線 points
                closePoints() {
                    if (!this.geom) return '';
                    return this.windowData.map((r, i) => {
                        const x = this.geom.left + i * this.geom.stride + this.body / 2;
                        const y = this.geom.y(r.c);
                        return `${x},${y}`;
                    }).join(' ');
                }
            },
            template: `
  <div class="mini-candle-box" :style="{width: width+'px', height: height+'px'}">
    <svg v-if="geom && windowData.length" :width="width" :height="height">
      <g v-for="(r,i) in windowData" :key="r.d"
         :transform="'translate('+(geom.left + i*geom.stride)+',0)'">
        <!-- 影線 -->
        <line :x1="body/2" :x2="body/2"
              :y1="geom.y(r.h)" :y2="geom.y(r.l)"
              class="candle-wick" :class="r.c>=r.o ? 'candle-wick-up':'candle-wick-down'"/>
        <!-- 本體（紅漲綠跌） -->
        <rect :x="0"
              :y="Math.min(geom.y(r.o), geom.y(r.c))"
              :width="body"
              :height="Math.max(2, Math.abs(geom.y(r.o)-geom.y(r.c)))"
              class="candle-body" :class="r.c>=r.o ? 'candle-up':'candle-down'"/>
      </g>

      <!-- 收盤折線：串起 Y 軸趨勢 -->
      <polyline v-if="showLine" :points="closePoints"
                fill="none" stroke="#ffa000" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
    </svg>
    <div v-else style="width:100%;height:100%;background:#eee;border-radius:3px;"></div>
  </div>`
        });
    </script>

                // 取得某列某日期的 OHLC；若該日沒有資料就回 null
                getOHLC(row, dateStr) {
                    const rec = (row?.datalist || []).find(x => x.日期 === dateStr);
                    if (!rec) return null;

                    // 你 Excel 若直接有「開盤價/最高價/最低價/收盤價」就取用；
                    // 若鍵名不同請在此對應。
                    const o = parseFloat(rec['開盤價']);
                    const h = parseFloat(rec['最高價']);
                    const l = parseFloat(rec['最低價']);
                    const c = parseFloat(rec['收盤價']);

                    if ([o, h, l, c].some(v => Number.isNaN(v))) return null;
                    return { o, h, l, c };
                },

                // 取得某「日期欄」在目前 filteredData 中的「全欄位高低」做一致縮放
                getColRange(dateStr) {
                    const key = String(dateStr);
                    if (this._colRangeCache[key]) return this._colRangeCache[key];

                    let hi = -Infinity, lo = Infinity;
                    this.filteredData.forEach(row => {
                        const ohlc = this.getOHLC(row, dateStr);
                        if (!ohlc) return;
                        hi = Math.max(hi, ohlc.h);
                        lo = Math.min(lo, ohlc.l);
                    });
                    if (!Number.isFinite(hi) || !Number.isFinite(lo) || hi === lo) {
                        // 退化處理：避免除以 0
                        hi = lo + 1;
                    }
                    const range = { min: lo, max: hi };
                    this._colRangeCache[key] = range;
                    return range;
                },

                // y 座標轉換（SVG：上方是 0）
                scaleY(v, dateStr, H) {
                    const pad = 2; // 內邊距
                    const { min, max } = this.getColRange(dateStr);
                    const t = (v - min) / (max - min);
                    return pad + (1 - t) * (H - 2 * pad);
                },

                // 判斷上/下漲 class
                kClass(ohlc) {
                    return (ohlc.c >= ohlc.o) ? { body: 'candle-up', wick: 'candle-wick-up' }
